<!DOCTYPE html>
<html>

<head>
<title>Task Manager Login</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f0f9ff;
margin:0;
}

.container{
width:350px;
margin:120px auto;
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:#0f172a;
}

input{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:10px;
border-radius:6px;
border:1px solid #bae6fd;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:6px;
background:#0284c7;
color:white;
cursor:pointer;
}

button:hover{
background:#0369a1;
}

.error{
color:#dc2626;
text-align:center;
margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<h2>Task Management Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

fetch("/users/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email.value,
password:password.value
})
})

.then(res=>{

if(!res.ok){
throw new Error("Invalid Login")
}

return res.json()

})

.then(user=>{

console.log(user)

/* store session */

localStorage.setItem("userId",user.id)
localStorage.setItem("role",user.role)
localStorage.setItem("name",user.name)

/* redirect */

if(user.role==="TEAM_LEAD")
window.location="lead.html"
else
window.location="member.html"

})

.catch(()=>{
alert("Invalid Email or Password")
})

}

</script>

</body>
</html>
