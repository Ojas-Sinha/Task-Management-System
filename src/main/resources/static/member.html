<!DOCTYPE html>
<html>
<head>
<title>Member Dashboard</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f0f9ff;
margin:0;
}

.header{
background:#0f172a;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logout{
background:#ef4444;
color:white;
border:none;
padding:8px 14px;
border-radius:4px;
cursor:pointer;
}

.container{
padding:20px;
}

/* cards */

.cards{
display:flex;
gap:20px;
margin-bottom:20px;
}

.card{
flex:1;
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
text-align:center;
}

.card p{
font-size:24px;
font-weight:bold;
color:#0284c7;
}

/* toolbar */

.taskToolbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:15px;
}

.searchBox input{
padding:10px 14px;
width:260px;
border-radius:8px;
border:1px solid #bae6fd;
font-size:14px;
outline:none;
}

.searchBox input:focus{
border-color:#0284c7;
box-shadow:0 0 4px rgba(2,132,199,0.4);
}

.filters{
display:flex;
gap:10px;
}

.filterBtn{
padding:8px 16px;
border:none;
border-radius:20px;
background:#e0f2fe;
color:#0369a1;
font-weight:500;
cursor:pointer;
}

.filterBtn.active{
background:#0284c7;
color:white;
}

/* table */

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
table-layout:fixed;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

th{
background:#0f172a;
color:#ffffff;
}

td{
word-wrap:break-word;
}

/* status */

.status{
padding:5px 10px;
border-radius:5px;
color:white;
font-size:12px;
}

.pending{background:#f59e0b;}
.working{background:#0284c7;}
.done{background:#22c55e;}

/* buttons */

.start{
background:#0284c7;
color:white;
}

.complete{
background:#22c55e;
color:white;
}
  
</style>

</head>

<body>

<div class="header">
<h2>Member Dashboard</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

<!-- Task Statistics -->

<div class="cards">

<div class="card">
<h3>Total Tasks</h3>
<p id="totalTasks">0</p>
</div>

<div class="card">
<h3>Pending</h3>
<p id="pendingTasks">0</p>
</div>

<div class="card">
<h3>Working</h3>
<p id="workingTasks">0</p>
</div>

<div class="card">
<h3>Done</h3>
<p id="doneTasks">0</p>
</div>

</div>

<!-- Search + Filters -->

<div class="taskToolbar">

<div class="searchBox">
<input 
type="text"
id="searchInput"
placeholder="Search tasks..."
onkeyup="renderTasks()"
/>
</div>

<div class="filters">

<button class="filterBtn active" onclick="setFilter('ALL',this)">All</button>
<button class="filterBtn" onclick="setFilter('WORKING',this)">Working</button>
<button class="filterBtn" onclick="setFilter('PENDING',this)">Pending</button>
<button class="filterBtn" onclick="setFilter('DONE',this)">Done</button>

</div>

</div>
<!-- Task Table -->

<table>

<thead>
<tr>
<th>Task</th>
<th>Description</th>
<th>Members</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="taskTable"></tbody>

</table>

</div>

<script>

let userId = localStorage.getItem("userId")

/* Protect dashboard */

if(!userId){
alert("Please login first")
window.location="login.html"
}

let allTasks=[]
let currentFilter="ALL"

/* Fetch tasks */

fetch("/tasks/user/"+userId)
.then(res=>res.json())
.then(tasks=>{

allTasks = tasks

renderTasks()

});

function setFilter(status,btn){

currentFilter=status;

/* remove active class */

document.querySelectorAll(".filterBtn")
.forEach(b=>b.classList.remove("active"));

/* add active class */

btn.classList.add("active");

renderTasks();

}

function renderTasks(){

let table=document.getElementById("taskTable");
table.innerHTML="";

let search=document.getElementById("searchInput").value.toLowerCase();

let filteredTasks=allTasks.filter(task=>{

let matchSearch=
task.title.toLowerCase().includes(search) ||
(task.description && task.description.toLowerCase().includes(search));

let matchFilter=
currentFilter==="ALL" || task.status===currentFilter;

return matchSearch && matchFilter;

});

/* Sort tasks: WORKING → PENDING → DONE */

filteredTasks.sort((a,b)=>{

const order={
WORKING:1,
PENDING:2,
DONE:3
};

return order[a.status]-order[b.status];

});

filteredTasks.forEach(task=>{

let statusClass="pending";

if(task.status==="WORKING") statusClass="working";
if(task.status==="DONE") statusClass="done";

let members = task.assignedUsers
.map(u=>u.name)
.join(", ");

/* Action logic */

let actions="";

if(task.status==="PENDING"){

actions=`
<button class="start"
onclick="updateStatus(${task.id},'WORKING')">
Start
</button>
`;

}

else if(task.status==="WORKING"){

actions=`
<button class="complete"
onclick="updateStatus(${task.id},'DONE')">
Done
</button>
`;

}

else{

actions=`<span style="color:green;font-weight:bold;">Completed</span>`;

}

let row=`
<tr>

<td>${task.title}</td>

<td>${task.description ? task.description : "-"}</td>

<td>${members}</td>

<td>
<span class="status ${statusClass}">
${task.status}
</span>
</td>

<td>${actions}</td>

</tr>
`;

table.innerHTML+=row;

});

/* Update dashboard cards */

document.getElementById("totalTasks").innerText=allTasks.length;
document.getElementById("pendingTasks").innerText=
allTasks.filter(t=>t.status==="PENDING").length;

document.getElementById("workingTasks").innerText=
allTasks.filter(t=>t.status==="WORKING").length;

document.getElementById("doneTasks").innerText=
allTasks.filter(t=>t.status==="DONE").length;

}

function updateStatus(id,status){

fetch("/tasks/update/"+id+"?status="+status,{
method:"PUT"
})
.then(()=>location.reload())

}

function logout(){

localStorage.clear();
window.location.href="login.html";

}

</script>

</body>
</html>
